<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>緊急連絡先</title>
<link rel="stylesheet" href="style.css?v=113">
<style>
body{background:#eef3f8;padding-bottom:120px}
header{background:#d32f2f;color:white;padding:24px 10px;text-align:center}
header h1{font-size:32px;margin:0}
header p{margin:6px 0 0;font-size:16px}
.backBtn{width:92%;max-width:780px;margin:16px auto;display:block;padding:16px;border:none;border-radius:16px;background:#555;color:white;font-size:22px;font-weight:bold}
.ecItem{background:white;margin:12px auto;padding:16px 18px;border-radius:14px;max-width:780px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ecLabel{font-size:20px;font-weight:bold;color:#333}
.ecName{font-size:16px;color:#666;margin-top:2px}
.ecTel{display:block;margin-top:10px;padding:14px;border-radius:12px;background:#2e9d45;color:white;font-size:24px;font-weight:bold;text-align:center;text-decoration:none}
.note{max-width:780px;margin:14px auto;padding:0 12px;font-size:15px;color:#666;text-align:center}
.loading{text-align:center;font-size:20px;color:#666;margin-top:30px}
</style>
</head>
<body>
<header>
<h1>📞 緊急連絡先</h1>
<p>道路状況（通行規制情報）ほか</p>
</header>
<button class="backBtn" onclick="location.href='index.html'">← 戻る</button>
<div class="note">番号をタップするとそのまま電話がかかります。連絡先の追加・変更は「⚙ 設定」から行えます。</div>
<div id="ecList"><div class="loading">読み込み中...</div></div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyA1GSV7KX6qMbIFIFz2ZhPNBVksiGxanKA",
authDomain:"tenken-rakuraku.firebaseapp.com",
databaseURL:"https://tenken-rakuraku-default-rtdb.firebaseio.com",
projectId:"tenken-rakuraku",
storageBucket:"tenken-rakuraku.firebasestorage.app",
messagingSenderId:"546571524606",
appId:"1:546571524606:web:dbe38f12c4b6ab4ad148af"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db=firebase.database();

const defaultContacts=[
{label:"国道18号",name:"国土交通省長野国道事務所",tel:"026-264-7003"},
{label:"道路交通情報",name:"日本道路交通情報センター",tel:"050-3369-6666"},
{label:"高速道路情報",name:"日本道路交通情報センター",tel:"050-3369-6700"},
{label:"道路交通情報サイト（一般道・全国）",name:"JARTIC 日本道路交通情報センター",url:"https://www.jartic.or.jp/"},
{label:"高速道路の渋滞・規制情報サイト",name:"ドラとら（NEXCO東日本）",url:"https://www.drivetraffic.jp/"},
{label:"上田林道",name:"森林整備課",tel:"0268-23-5124"},
{label:"長野県建設部",name:"道路管理課",tel:"026-235-7301"},

{label:"国道18号以外の国道・県道（佐久北部）",name:"佐久建設事務所",tel:"0267-63-3111"},
{label:"国道18号以外の国道・県道（佐久南部）",name:"佐久建設事務所",tel:"0267-82-3101"},
{label:"国道18号以外の国道・県道（諏訪地区）",name:"諏訪建設事務所",tel:"0266-53-6000"},

{label:"国道18号以外の国道・県道（安曇野地区）",name:"安曇野建設事務所",tel:"0263-72-8880"},
{label:"国道18号以外の国道・県道（長野地区）",name:"長野建設事務所",tel:"026-234-9539"},
{label:"国道18号以外の国道・県道（千曲地区）",name:"千曲建設事務所",tel:"026-273-5940"},

{label:"山梨県道路規制情報",name:"中北建設事務所",tel:"055-224-1667"},
{label:"群馬県道路規制情報",name:"県土整備部道路管理課",tel:"027-226-3595"},
{label:"埼玉県道路規制情報",name:"県土整備部道路管理課",tel:"048-830-5095"}
];

function renderContacts(list){
const box=document.getElementById("ecList");
box.innerHTML="";
if(!list||!list.length){
box.innerHTML="<div class='loading'>連絡先が登録されていません。<br>「⚙ 設定」から追加してください。</div>";
return;
}
list.forEach(function(c){
const item=document.createElement("div");
item.className="ecItem";
let btns="";
if(c.tel)btns+="<a class='ecTel' href='tel:"+c.tel+"'>📞 "+c.tel+"</a>";
if(c.url)btns+="<a class='ecTel' style='background:#1976d2;' href='"+c.url+"' target='_blank' rel='noopener'>🌐 サイトを開く</a>";
item.innerHTML="<div class='ecLabel'>"+c.label+"</div>"+
(c.name?"<div class='ecName'>"+c.name+"</div>":"")+btns;
box.appendChild(item);
});
}

document.addEventListener("DOMContentLoaded",function(){
db.ref("settings/emergencyContacts").once("value").then(function(snap){
const list=snap.val()||JSON.parse(localStorage.getItem("tenken_contacts")||"null")||defaultContacts;
localStorage.setItem("tenken_contacts",JSON.stringify(list));
renderContacts(list);
}).catch(function(){
const list=JSON.parse(localStorage.getItem("tenken_contacts")||"null")||defaultContacts;
renderContacts(list);
});
});
</script>
</body>
</html>
