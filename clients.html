<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取引先</title>
<style>
body{background:#eef3f8;padding:0;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:120px}
header{background:#1565c0;color:white;padding:24px 10px;text-align:center}
header h1{font-size:30px;margin:0}
header p{margin:6px 0 0;font-size:15px}
.backBtn{width:92%;max-width:780px;margin:16px auto 8px;display:block;padding:16px;border:none;border-radius:16px;background:#555;color:white;font-size:22px;font-weight:bold}
.viewTabs{display:flex;gap:8px;max-width:780px;margin:0 auto 4px;padding:0 12px}
.viewTab{flex:1;padding:14px;border:none;border-radius:12px;background:#dbe7f5;color:#1565c0;font-size:18px;font-weight:bold}
.viewTab.active{background:#1565c0;color:white}
.ctItem{background:white;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ctComp{font-size:17px;font-weight:bold;color:#333}
.ctRow{border-bottom:1px dashed #e2e8f0;padding:6px 0;font-size:14px;color:#444}
.ctSheet{background:#e0f2fe;color:#0369a1;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:bold}
.ctRoute{font-weight:bold}
.ctNote{color:#b45309;font-size:12px;margin-top:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 12px}
.clSearch{width:100%;font-size:18px;padding:14px;border:1px solid #bbb;border-radius:12px;box-sizing:border-box;margin:8px 0}
.kanaIdx{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.kanaBtn{padding:9px 13px;border:none;border-radius:10px;background:#dbe7f5;color:#1565c0;font-size:16px;font-weight:bold}
.kanaBtn.active{background:#1565c0;color:white}
.clItem{background:white;border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.clName{font-size:18px;font-weight:bold;color:#333}
.clYomi{font-size:12px;color:#999}
.clAddr{font-size:14px;color:#555;margin-top:4px}
.clMemo{font-size:13px;color:#8a6d3b;background:#fdf6e3;border-radius:8px;padding:6px 8px;margin-top:6px}
.clBtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.clBtn{flex:1;min-width:120px;display:block;padding:12px;border-radius:12px;font-size:16px;font-weight:bold;text-align:center;text-decoration:none;color:white}
.clTel{background:#2e9d45}
.clMap{background:#1565c0}
.clRoute{background:#e67e22}
.loading{text-align:center;font-size:19px;color:#666;margin-top:30px}
.count{font-size:13px;color:#888;margin:4px 0}
/* ルート作成 */
#routeModeBtn{width:100%;padding:14px;border:none;border-radius:12px;background:white;color:#1565c0;font-size:18px;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,.08);margin:4px 0 10px}
#routeModeBtn.on{background:#1565c0;color:white}
.clItem.routeSel{border:3px solid #1565c0;background:#e8f1fb}
.routeBadge{min-width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;background:#eef3f8;color:#94a3b8;flex-shrink:0}
.routeBadge.num{background:#1565c0;color:white}
.routeCard{display:flex;align-items:center;gap:12px;cursor:pointer}
.routeCard .rcInfo{flex:1;min-width:0}
#routeBar{display:none;position:fixed;left:0;right:0;bottom:0;background:white;box-shadow:0 -2px 12px rgba(0,0,0,.2);padding:12px 14px 22px;z-index:90;border-radius:16px 16px 0 0}
#routeBar.show{display:block}
.rbInner{max-width:780px;margin:0 auto}
.rbRow1{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:bold;margin-bottom:8px}
.rbCount{color:#1565c0}
.rbRound{margin-left:auto;font-size:15px;font-weight:bold;color:#555;display:flex;align-items:center;gap:5px}
.rbRound input{width:20px;height:20px}
.rbOrigin{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rbOrigin label{font-size:14px;color:#666;font-weight:bold;white-space:nowrap}
.rbOrigin input{flex:1;padding:11px 10px;font-size:16px;border:1px solid #bbb;border-radius:10px;min-width:0}
.rbHome{border:none;border-radius:10px;background:#dbe7f5;color:#1565c0;font-size:14px;font-weight:bold;padding:11px 10px;white-space:nowrap}
.rbBtns{display:flex;gap:8px}
.rbBtns button{padding:15px 6px;border:none;border-radius:12px;font-size:16px;font-weight:bold}
.rbOpen{flex:2;background:#1565c0;color:white}
.rbSub{flex:1;background:#dbe7f5;color:#1565c0}
body.routeOpen{padding-bottom:240px}
#routeToast{position:fixed;bottom:250px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 22px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
#routeToast.show{opacity:1}
</style>
</head>
<body>
<header>
<h1>🏢 取引先</h1>
<p>登録・修正は「共通マスタ管理」アプリから</p>
</header>
<button class="backBtn" onclick="location.href='index.html'">← 戻る</button>
<div class="viewTabs">
<button class="viewTab active" id="viewTabClients" onclick="switchView('clients')">🏢 取引先</button>
<button class="viewTab" id="viewTabContracts" onclick="switchView('contracts')">📋 契約（処分先）</button>
</div>
<div class="wrap" id="clientsView">
<input type="text" id="clSearchBox" class="clSearch" placeholder="🔍 会社名・よみがな・電話で検索" oninput="drawClients()">
<div class="kanaIdx" id="kanaIdx"></div>
<button id="routeModeBtn" onclick="toggleRouteMode()">🗺 運搬ルート作成（回る順に取引先を選ぶ）</button>
<div class="count" id="clCount"></div>
<div id="clList"><div class="loading">読み込み中...</div></div>
</div>

<div class="wrap" id="contractsView" style="display:none;">
<div class="kanaIdx" id="dispTabs"></div>
<div class="kanaIdx" id="ctKanaIdx"></div>
<input type="text" id="ctSearchBox" class="clSearch" placeholder="🔍 会社名・品目で検索（例：廃プラ）" oninput="drawContracts()">
<div class="count" id="ctCount"></div>
<div id="ctList"><div class="loading">読み込み中...</div></div>
</div>

<div id="routeBar">
<div class="rbInner">
<div class="rbRow1">
🗺 ルート作成中　<span class="rbCount" id="rbCount">0件選択</span>
<label class="rbRound"><input type="checkbox" id="rbRound">会社に戻る(往復)</label>
</div>
<div class="rbOrigin">
<label>出発地</label>
<input type="text" id="rbOrigin" onchange="saveRouteOrigin()">
<button class="rbHome" onclick="resetRouteOrigin()">🏠 会社に戻す</button>
</div>
<div class="rbBtns">
<button class="rbOpen" onclick="openRouteMap()">🗺 Googleマップで開く</button>
<button class="rbSub" onclick="clearRouteSel()">選び直す</button>
<button class="rbSub" onclick="toggleRouteMode()">✕ 終了</button>
</div>
</div>
</div>
<div id="routeToast"></div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
<script>
const sekineConfig={
apiKey:"AIzaSyD99Mx0MnGpLSQjV7830bS7-gdCBSM9DGY",
authDomain:"sekine-store.firebaseapp.com",
projectId:"sekine-store",
storageBucket:"sekine-store.firebasestorage.app",
messagingSenderId:"781856496751",
appId:"1:781856496751:web:e2e1e5de4cd803415a819a"
};
let sekineApp;
try{sekineApp=firebase.app("sekine");}catch(e){sekineApp=firebase.initializeApp(sekineConfig,"sekine");}
const fsdb=sekineApp.firestore();

function escapeText(s){
return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
const KANA_ROWS=[
{label:"あ",chars:"あいうえおぁぃぅぇぉ"},
{label:"か",chars:"かきくけこがぎぐげご"},
{label:"さ",chars:"さしすせそざじずぜぞ"},
{label:"た",chars:"たちつてとだぢづでどっ"},
{label:"な",chars:"なにぬねの"},
{label:"は",chars:"はひふへほばびぶべぼぱぴぷぺぽ"},
{label:"ま",chars:"まみむめも"},
{label:"や",chars:"やゆよゃゅょ"},
{label:"ら",chars:"らりるれろ"},
{label:"わ",chars:"わをん"}
];
function kanaRowOf(yomi){
const c=(yomi||"").trim().charAt(0);
if(!c)return "他";
for(const r of KANA_ROWS){if(r.chars.indexOf(c)>=0)return r.label;}
return "他";
}
let clients=[];
let kanaFilter="";
function drawKanaIdx(){
const box=document.getElementById("kanaIdx");
const labels=[""].concat(KANA_ROWS.map(function(r){return r.label;})).concat(["他"]);
box.innerHTML=labels.map(function(l){
const label=(l==="")?"全て":l;
return '<button class="kanaBtn'+(kanaFilter===l?" active":"")+'" onclick="setKana(\''+l+'\')">'+label+'</button>';
}).join("");
}
window.setKana=function(l){kanaFilter=l;drawKanaIdx();drawClients();};
function drawClients(){
const q=(document.getElementById("clSearchBox").value||"").trim();
let list=clients;
if(kanaFilter)list=list.filter(function(c){return kanaRowOf(c.yomi)===kanaFilter;});
if(q)list=list.filter(function(c){
return (c.name||"").includes(q)||(c.yomi||"").includes(q)||(c.tel||"").includes(q);
});
document.getElementById("clCount").textContent=list.length+"社";
const box=document.getElementById("clList");
if(!list.length){box.innerHTML='<div class="loading">該当する取引先がありません</div>';return;}
box.innerHTML="";
list.forEach(function(c){
const item=document.createElement("div");
item.className="clItem";
if(routeMode){
const order=routeSel.indexOf(c.id);
const sel=order>=0;
if(sel)item.classList.add("routeSel");
item.innerHTML="<div class='routeCard' onclick=\"toggleRouteSel('"+c.id+"')\">"+
"<div class='rcInfo'><div class='clName'>"+escapeText(c.name||"")+"</div>"+
"<div class='clAddr'>"+(c.address?"📍 "+escapeText(c.address):"⚠ 住所未登録（会社名で検索されます）")+"</div></div>"+
"<div class='routeBadge"+(sel?" num":"")+"'>"+(sel?order+1:"")+"</div></div>";
box.appendChild(item);
return;
}
let btns="";
if(c.tel)btns+="<a class='clBtn clTel' href='tel:"+escapeText(c.tel)+"'>📞 "+escapeText(c.tel)+"</a>";
if(c.address)btns+="<a class='clBtn clMap' href='https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c.address)+"' target='_blank' rel='noopener'>🗺 地図を開く</a>";
if(c.address)btns+="<a class='clBtn clRoute' href='https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(ROUTE_HOME_ADDRESS)+"&destination="+encodeURIComponent(c.address)+"&travelmode=driving' target='_blank' rel='noopener'>🚚 会社からルート</a>";
item.innerHTML="<div class='clName'>"+escapeText(c.name||"")+"</div>"+
(c.yomi?"<div class='clYomi'>"+escapeText(c.yomi)+"</div>":"")+
(c.address?"<div class='clAddr'>📍 "+escapeText(c.address)+"</div>":"")+
(c.memo?"<div class='clMemo'>📝 "+escapeText(c.memo)+"</div>":"")+
(btns?"<div class='clBtns'>"+btns+"</div>":"");
box.appendChild(item);
});
}

/* ---------- 運搬ルート作成 ---------- */
const ROUTE_ORIGIN_KEY="sekine_route_origin";
const ROUTE_HOME_ADDRESS="長野県上田市住吉316-2";
const ROUTE_MAX=9;
let routeMode=false;
let routeSel=[];
let routeToastTimer;
function routeToast(msg){
const t=document.getElementById("routeToast");
t.textContent=msg;
t.classList.add("show");
clearTimeout(routeToastTimer);
routeToastTimer=setTimeout(function(){t.classList.remove("show");},2500);
}
window.toggleRouteMode=function(){
routeMode=!routeMode;
if(!routeMode)routeSel=[];
document.getElementById("routeModeBtn").classList.toggle("on",routeMode);
document.getElementById("routeModeBtn").textContent=
routeMode?"🗺 ルート作成中（もう一度押すと終了）":"🗺 運搬ルート作成（回る順に取引先を選ぶ）";
document.getElementById("routeBar").classList.toggle("show",routeMode);
document.body.classList.toggle("routeOpen",routeMode);
if(routeMode){
document.getElementById("rbOrigin").value=localStorage.getItem(ROUTE_ORIGIN_KEY)||ROUTE_HOME_ADDRESS;
}
updateRouteCount();
drawClients();
};
window.saveRouteOrigin=function(){
localStorage.setItem(ROUTE_ORIGIN_KEY,document.getElementById("rbOrigin").value.trim());
};
window.resetRouteOrigin=function(){
document.getElementById("rbOrigin").value=ROUTE_HOME_ADDRESS;
saveRouteOrigin();
routeToast("🏠 出発地を会社に戻しました");
};
function updateRouteCount(){
document.getElementById("rbCount").textContent=routeSel.length+"件選択";
}
window.toggleRouteSel=function(id){
const i=routeSel.indexOf(id);
if(i>=0){
routeSel.splice(i,1);
}else{
if(routeSel.length>=ROUTE_MAX){routeToast("⚠️ 一度に選べるのは"+ROUTE_MAX+"件までです");return;}
const c=clients.find(function(x){return x.id===id;});
if(c&&!c.address)routeToast("⚠ 住所未登録のため会社名で検索されます");
routeSel.push(id);
}
updateRouteCount();
drawClients();
};
window.clearRouteSel=function(){
routeSel=[];
updateRouteCount();
drawClients();
};
window.openRouteMap=function(){
if(!routeSel.length){routeToast("回る順に取引先をタップしてください");return;}
const origin=document.getElementById("rbOrigin").value.trim();
if(!origin){routeToast("出発地を入力してください");return;}
saveRouteOrigin();
const stops=routeSel.map(function(id){return clients.find(function(x){return x.id===id;});})
.filter(Boolean)
.map(function(c){return c.address?c.address:(c.name+" 長野県");});
const round=document.getElementById("rbRound").checked;
let destination,waypoints;
if(round){destination=origin;waypoints=stops;}
else{destination=stops[stops.length-1];waypoints=stops.slice(0,-1);}
let url="https://www.google.com/maps/dir/?api=1"
+"&origin="+encodeURIComponent(origin)
+"&destination="+encodeURIComponent(destination)
+"&travelmode=driving";
if(waypoints.length)url+="&waypoints="+waypoints.map(encodeURIComponent).join("%7C");
window.open(url,"_blank");
};
let contractsData=null;
let companyYomi={};
let dispFilter="";
let dispVals=[];
window.switchView=function(v){
if(v!=="clients"&&routeMode)toggleRouteMode();
document.getElementById("clientsView").style.display=(v==="clients")?"block":"none";
document.getElementById("contractsView").style.display=(v==="contracts")?"block":"none";
document.getElementById("viewTabClients").classList.toggle("active",v==="clients");
document.getElementById("viewTabContracts").classList.toggle("active",v==="contracts");
dispFilter="";ctKanaFilter="";
if(v==="contracts"){if(contractsData===null)loadContracts();else drawContracts();}
};
function contractContentDisp(s){
const t=(s||"").trim();
if(t==="〇"||t==="○"||t==="0")return "契約あり（日付不明）";
return t;
}
function loadContracts(){
Promise.all([
fsdb.collection("master_contracts").get(),
fsdb.collection("master_company_yomi").get()
]).then(function(res){
contractsData=res[0].docs.map(function(d){return d.data();});
companyYomi={};
res[1].docs.forEach(function(d){const v=d.data();if(v.name)companyYomi[v.name]=v.yomi||"";});
drawContracts();
}).catch(function(e){
document.getElementById("ctList").innerHTML='<div class="loading">読み込みに失敗しました。電波の良い場所でもう一度お試しください</div>';
});
}
function yomiOf(name){
if(companyYomi[name])return companyYomi[name];
const c=clients.find(function(x){return x.name===name;});
if(c&&c.yomi)return c.yomi;
return "んんんん"+name;
}
function dispOf(c){
return (c.disposer||"").trim()||((c.route||"").split("／")[0]||"").trim();
}
function itemOf(c){
const disp=dispOf(c);
const parts=(c.route||"").split("／").map(function(s){return s.trim();}).filter(Boolean);
const rest=parts.filter(function(p){return p!==disp;});
return rest.join("／")||c.sheet||"";
}
let ctKanaFilter="";
function ctKanaOf(name){
const y=companyYomi[name]||((clients.find(function(x){return x.name===name;})||{}).yomi||"");
if(!y)return "他";
return kanaRowOf(y);
}
window.setCtKana=function(k){ctKanaFilter=k;drawContracts();};
function drawCtKanaIdx(){
const labels=[""].concat(KANA_ROWS.map(function(r){return r.label;})).concat(["他"]);
document.getElementById("ctKanaIdx").innerHTML=labels.map(function(l){
return '<button class="kanaBtn'+(ctKanaFilter===l?" active":"")+'" onclick="setCtKana(\''+l+'\')">'+(l===""?"全て":l)+'</button>';
}).join("");
}
window.setDispIdx=function(i){dispFilter=dispVals[i];drawContracts();};
window.toggleCt=function(id){
const el=document.getElementById(id);
el.style.display=(el.style.display==="none")?"block":"none";
};
function drawDispTabs(){
const disps={};
let unknown=0;
contractsData.filter(function(c){return !c.isMemo;}).forEach(function(c){
const d=dispOf(c);
if(d)disps[d]=(disps[d]||0)+1;else unknown++;
});
const names=Object.keys(disps).sort(function(a,b){return a.localeCompare(b,"ja");});
dispVals=[""].concat(names);
const labels=["すべて"].concat(names.map(function(n){return n+"（"+disps[n]+"）";}));
if(unknown){dispVals.push("＿unknown＿");labels.push("処分先不明（"+unknown+"）");}
const box=document.getElementById("dispTabs");
box.innerHTML=labels.map(function(lb,i){
return '<button class="kanaBtn'+(dispFilter===dispVals[i]?" active":"")+'" onclick="setDispIdx('+i+')">'+escapeText(lb)+'</button>';
}).join("");
}
function drawContracts(){
if(!contractsData)return;
drawDispTabs();
drawCtKanaIdx();
const q=(document.getElementById("ctSearchBox").value||"").trim();
let list=contractsData.filter(function(c){return !c.isMemo;});
if(dispFilter==="＿unknown＿")list=list.filter(function(c){return !dispOf(c);});
else if(dispFilter)list=list.filter(function(c){return dispOf(c)===dispFilter;});
if(ctKanaFilter)list=list.filter(function(c){return ctKanaOf(c.company)===ctKanaFilter;});
if(q)list=list.filter(function(c){
return (c.company||"").includes(q)||(c.route||"").includes(q)||(c.content||"").includes(q)||(c.sheet||"").includes(q)||yomiOf(c.company).includes(q);
});
const byComp={};
list.forEach(function(c){(byComp[c.company]=byComp[c.company]||[]).push(c);});
const names=Object.keys(byComp).sort(function(a,b){return yomiOf(a).localeCompare(yomiOf(b),"ja");});
const filterLabel=(dispFilter==="＿unknown＿")?"処分先不明":(dispFilter||"");
document.getElementById("ctCount").textContent=(filterLabel?filterLabel+"：":"")+names.length+"社・契約"+list.length+"件（会社名をタップすると契約内容が開きます）";
const box=document.getElementById("ctList");
if(!names.length){box.innerHTML='<div class="loading">該当する契約がありません</div>';return;}
box.innerHTML="";
names.forEach(function(name,idx){
const item=document.createElement("div");
item.className="ctItem";
const rows=byComp[name].sort(function(a,b){return (a.sheet||"").localeCompare(b.sheet||"","ja");}).map(function(c){
return "<div class='ctRow'>"+
"<b>品名：</b>"+escapeText(itemOf(c))+" <span class='ctSheet'>"+escapeText(c.sheet||"")+"</span><br>"+
"<b>処分先：</b>"+escapeText(dispOf(c)||"（不明）")+"<br>"+
"<b>契約日：</b>"+escapeText(contractContentDisp(c.content))+
(c.note?"<div class='ctNote'>📝 備考："+escapeText(c.note)+"</div>":"")+"</div>";
}).join("");
const detailId="ctd"+idx;
const dspList=Array.from(new Set(byComp[name].map(function(c){return dispOf(c)||"不明";}))).join("・");
item.innerHTML="<div class='ctComp' onclick=\"toggleCt('"+detailId+"')\" style='cursor:pointer;'>"+escapeText(name)+
"<span style='color:#94a3b8;font-size:12px;font-weight:normal;'>　"+byComp[name].length+"件 ▼</span>"+
"<div style='font-size:12px;font-weight:normal;color:#00695c;'>→ "+escapeText(dspList)+"</div></div>"+
"<div id='"+detailId+"' style='display:"+(q||dispFilter==="＿unknown＿"?"block":"none")+";'>"+rows+"</div>";
box.appendChild(item);
});
}

document.addEventListener("DOMContentLoaded",function(){
drawKanaIdx();
fsdb.collection("master_clients").get().then(function(snap){
clients=snap.docs.map(function(d){const o=d.data();o.id=d.id;return o;});
clients.sort(function(a,b){return (a.yomi||"んんん").localeCompare(b.yomi||"んんん","ja");});
drawClients();
}).catch(function(e){
document.getElementById("clList").innerHTML='<div class="loading">読み込みに失敗しました。電波の良い場所でもう一度お試しください</div>';
});
});
</script>
</body>
</html>
