<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>不具合報告一覧</title>
<link rel="stylesheet" href="style.css?v=112">
<style>
body{background:#eef3f8;padding-bottom:60px;font-family:Arial,"Hiragino Sans",sans-serif}
header{background:#e53935;color:white;padding:24px 10px;text-align:center}
header h1{font-size:32px;margin:0}
.backBtn{width:92%;max-width:780px;margin:16px auto;display:block;padding:16px;border:none;border-radius:16px;background:#555;color:white;font-size:20px;font-weight:bold}
.reportCard{background:white;margin:14px auto;padding:18px;border-radius:16px;max-width:780px;box-shadow:0 2px 8px rgba(0,0,0,.12);text-align:left}
.reportCard.done{opacity:.65}
.reportHead{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:bold;color:#333}
.reportBody{font-size:18px;margin:12px 0;white-space:pre-wrap;line-height:1.6;color:#222}
.stBtns{display:flex;gap:8px}
.stBtns button{flex:1;padding:14px 4px;border:2px solid #ccc;border-radius:12px;font-size:17px;font-weight:bold;background:#fff;color:#555}
.stBtns button.on.s0{background:#e53935;border-color:#e53935;color:#fff}
.stBtns button.on.s1{background:#f59e0b;border-color:#f59e0b;color:#fff}
.stBtns button.on.s2{background:#2e9d45;border-color:#2e9d45;color:#fff}
.fixBox{margin-top:10px;padding:12px;border-radius:12px;background:#e8f5e9;border:2px solid #2e9d45}
.fixBox label{font-size:16px;font-weight:bold;color:#1b5e20}
.fixBox input{width:100%;box-sizing:border-box;margin:6px 0 10px;padding:12px;font-size:17px;border:1px solid #aaa;border-radius:10px}
.fixBox .row{display:flex;gap:8px}
.fixBox .row button{flex:1;padding:12px;border:none;border-radius:10px;font-size:17px;font-weight:bold}
.fixInfo{margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#e8f5e9;color:#1b5e20;font-size:16px}
.delLink{display:block;margin:10px 0 0 auto;background:none;border:none;color:#999;font-size:14px;text-decoration:underline}
.stTag{display:inline-block;padding:2px 10px;border-radius:10px;color:#fff;font-size:15px;margin-right:6px}
.empty{text-align:center;color:#888;font-size:18px;margin-top:40px}
.filterBar{width:92%;max-width:780px;margin:14px auto;display:flex;gap:10px;justify-content:center}
.filterBar button{flex:1;padding:12px;border:none;border-radius:12px;font-size:16px;font-weight:bold;background:#ddd;color:#333}
.filterBar button.active{background:#1976d2;color:white}
</style>
</head>
<body>
<header><h1>🛠 不具合報告一覧</h1></header>
<button class="backBtn" onclick="location.href='index.html'">← ホームに戻る</button>
<div class="filterBar">
<button id="filterOpen" class="active" onclick="setFilter('open')">まだ直していない</button>
<button id="filterDone" onclick="setFilter('対応済')">対応済</button>
<button id="filterAll" onclick="setFilter('all')">すべて</button>
</div>
<div id="reportList"></div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyA1GSV7KX6qMbIFIFz2ZhPNBVksiGxanKA",
authDomain:"tenken-rakuraku.firebaseapp.com",
databaseURL:"https://tenken-rakuraku-default-rtdb.firebaseio.com",
projectId:"tenken-rakuraku",
storageBucket:"tenken-rakuraku.firebasestorage.app",
messagingSenderId:"546571524606",
appId:"1:546571524606:web:dbe38f12c4b6ab4ad148af"
};
if(!firebase.apps.length){firebase.initializeApp(firebaseConfig);}
const db=firebase.database();

let allReports=[];
let currentFilter="open";
let fixOpen="";   // 「対応済」を押して、どう直したかを書いている報告のid
/* 状況は3つ：未対応・検討中・対応済。対応済にしても消さずに残す(ISO管理の「車両不具合・修理記録」に毎月まとめるため)
   間違えて報告したものは status:"取消" にして一覧から隠す(ISO管理からも消える) */
const STS=["未対応","検討中","対応済"];
const pad2=n=>String(n).padStart(2,"0");
function todayStr(){const d=new Date();return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate();}

function setFilter(f){
currentFilter=f;
document.getElementById("filterOpen").classList.toggle("active",f==="open");
document.getElementById("filterDone").classList.toggle("active",f==="対応済");
document.getElementById("filterAll").classList.toggle("active",f==="all");
render();
}
function fail(){alert("変更に失敗しました。通信を確認してください。");}
function setStatus(id,st){
const r=allReports.find(x=>x.id===id); if(!r)return;
if(st==="対応済"){fixOpen=(fixOpen===id?"":id);render();setTimeout(function(){const i=document.getElementById("fixHow_"+id);if(i)i.focus();},50);return;}
if((r.status||"未対応")===st)return;
db.ref("reports/"+id).update({status:st,statusAt:Date.now(),fixDate:null,fixHow:null}).then(loadReports).catch(fail);
}
function saveFix(id){
const how=(document.getElementById("fixHow_"+id).value||"").trim();
fixOpen="";
db.ref("reports/"+id).update({status:"対応済",statusAt:Date.now(),fixDate:todayStr(),fixHow:how}).then(loadReports).catch(fail);
}
function cancelFix(){fixOpen="";render();}
function delReport(id){
if(!confirm("間違えて報告したものだけ消してください。\n（直したときは「✅ 対応済」を押します）\n\nこの報告を消しますか？"))return;
db.ref("reports/"+id).update({status:"取消",statusAt:Date.now()}).then(loadReports).catch(fail);
}

function escapeHtml(str){
return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function render(){
const list=document.getElementById("reportList");
list.innerHTML="";
let items=allReports.filter(function(r){return r.status!=="取消";});
if(currentFilter==="open"){items=items.filter(function(r){return r.status!=="対応済";});}
else if(currentFilter!=="all"){items=items.filter(function(r){return r.status===currentFilter;});}
if(!items.length){
list.innerHTML="<div class='empty'>"+(currentFilter==="open"?"まだ直していない報告はありません 👍":"報告はありません")+"</div>";
return;
}
items.forEach(function(r){
const st=STS.indexOf(r.status)>=0?r.status:"未対応", si=STS.indexOf(st);
const card=document.createElement("div");
card.className="reportCard"+(st==="対応済"?" done":"");
card.innerHTML=
"<div class='reportHead'><span>📅 "+escapeHtml(r.date||"")+"　🚚 "+escapeHtml(r.vehicle||"")+"</span><span>👤"+escapeHtml(r.staff||"-")+"</span></div>"+
"<div class='reportBody'>"+escapeHtml(r.content||"")+"</div>"+
(st==="対応済"?"<div class='fixInfo'>✅ "+escapeHtml(r.fixDate||"")+" 対応済"+(r.fixHow?"<br>どう直した：<b>"+escapeHtml(r.fixHow)+"</b>":"")+"</div>":"")+
"<div class='stBtns'>"+[["⚠️ 未対応","未対応"],["🤔 検討中","検討中"],["✅ 対応済","対応済"]].map(function(b,i){
  return "<button class='s"+i+(i===si?" on":"")+"' onclick='setStatus(\""+r.id+"\",\""+b[1]+"\")'>"+b[0]+"</button>";}).join("")+"</div>"+
(fixOpen===r.id?"<div class='fixBox'><label for='fixHow_"+r.id+"'>どう直した？（書かなくてもOK）</label><input id='fixHow_"+r.id+"' placeholder='例：部品交換、○○自動車で修理' value='"+escapeHtml(r.fixHow||"")+"'>"+
  "<div class='row'><button style='background:#ddd;color:#333' onclick='cancelFix()'>やめる</button><button style='background:#2e9d45;color:#fff' onclick='saveFix(\""+r.id+"\")'>✅ 対応済にする</button></div></div>":"")+
"<button class='delLink' onclick='delReport(\""+r.id+"\")'>間違えて報告したので消す</button>";
list.appendChild(card);
});
}

function loadReports(){
db.ref("reports").once("value").then(function(snap){
const val=snap.val()||{};
allReports=Object.keys(val).map(function(id){
const r=val[id];
r.id=id;
return r;
}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
render();
}).catch(function(){
document.getElementById("reportList").innerHTML="<div class='empty'>読み込みに失敗しました。通信を確認して開き直してください。</div>";
});
}

document.addEventListener("DOMContentLoaded",loadReports);
</script>
</body>
</html>
